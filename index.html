<meta charset="utf-8">

<body>
<title>Rastgele Girdi</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tek ekran tezgâh — üstte araç çubuğu, ortada girdi sahnesi (görsel ya da dev kelime), altta tek büyük "Yeni girdi" düğmesi. Projeksiyonda tam ekran, telefonda tek sütun. */
:root {
  --bg: #eef0f4;          /* soğuk kâğıt */
  --surface: #ffffff;
  --stage: #e3e6ec;       /* görselin oturduğu zemin */
  --ink: #15171d;
  --muted: #5b6070;
  --line: #cdd1da;
  --accent: #2f45d1;      /* ultramarin: tek vurgu */
  --accent-ink: #ffffff;
  --warn: #c2410c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1016; --surface: #171a22; --stage: #1d212b; --ink: #e8eaf0; --muted: #9aa0b2;
    --line: #2c313d; --accent: #8593ff; --accent-ink: #0e1016; --warn: #fb923c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1016; --surface: #171a22; --stage: #1d212b; --ink: #e8eaf0; --muted: #9aa0b2;
  --line: #2c313d; --accent: #8593ff; --accent-ink: #0e1016; --warn: #fb923c; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto auto; gap: 12px; max-width: 1600px; margin-inline: auto; }

/* Araç çubuğu */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; margin: 0; }
.brand .src { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
.src .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.src.live .dot { background: #16a34a; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { font: 500 0.85rem var(--font-body); color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tools { display: flex; align-items: center; gap: 8px; }
select, .ghost {
  font: 500 0.85rem var(--font-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer;
}
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Odak satırı */
.focus { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.focus label { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.focus input { flex: 1; min-width: 0; font: 600 clamp(1rem, 1.6vw, 1.35rem) var(--font-display); color: var(--ink); background: transparent; border: 0; padding: 4px 0; }
.focus input::placeholder { color: var(--muted); font-weight: 400; }

/* Sahne */
.stage { position: relative; min-height: 0; background: var(--stage); border-radius: var(--r); overflow: hidden; display: grid; place-items: center; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.word { font-family: var(--font-display); font-weight: 800; font-size: clamp(3rem, 11vw, 11rem); line-height: 0.95; letter-spacing: -0.03em; text-align: center; text-wrap: balance; padding: 0.3em; margin: 0; overflow-wrap: anywhere; }
.timebar { position: absolute; inset: 0 0 auto 0; height: 6px; background: transparent; }
.timebar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s linear; }
.stage.done .timebar span { background: var(--warn); }
.loading { position: absolute; inset: auto 0 14px 0; text-align: center; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.stage.busy > img, .stage.busy > .word { opacity: 0.35; transition: opacity 0.2s; }
.ended { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); background: var(--warn); color: #fff; font: 600 0.9rem var(--font-body); padding: 6px 14px; border-radius: 999px; }

/* Künye */
.credit { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; font-size: 0.85rem; color: var(--muted); min-height: 1.4em; }
.credit .no { font-family: var(--font-mono); color: var(--ink); font-weight: 500; }
.credit .kind { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.72rem; }
.credit .ttl { color: var(--ink); font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.credit a { color: var(--accent); }

/* Alt kontroller */
.controls { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.big { font: 700 clamp(1.05rem, 1.8vw, 1.4rem) var(--font-display); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 16px 28px; cursor: pointer; }
.big:active { transform: translateY(1px); }
.nav { display: flex; gap: 8px; }
.nav button { width: 52px; height: 52px; border-radius: 50%; font-size: 1.2rem; }
.clock { font: 500 clamp(1.4rem, 2.4vw, 2rem) var(--font-mono); font-variant-numeric: tabular-nums; min-width: 4.5ch; text-align: right; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 6px 4px; }
.clock.off { color: var(--muted); font-size: 1rem; }
.hint { font-size: 0.78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: space-between; }
.hint kbd { font-family: var(--font-mono); font-size: 0.72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); color: var(--ink); }

@media (max-width: 640px) {
  .app { grid-template-rows: auto auto minmax(260px, 1fr) auto auto; }
  .bar > * { min-width: 0; }
  .brand { width: 100%; }
  .seg { width: 100%; }
  .seg button { flex: 1 1 0; min-width: 0; padding-inline: 4px; font-size: 0.8rem; }
  .tools { width: 100%; }
  .tools select { flex: 1; min-width: 0; }
  .big { padding-inline: 16px; }
  .controls { grid-template-columns: auto 1fr; }
  .controls .clock { grid-column: 1 / -1; grid-row: 1; text-align: center; }
  .hint .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
:fullscreen body, :fullscreen { background: var(--bg); }
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <h1>Rastgele Girdi</h1>
      <span class="src" id="src"><span class="dot"></span><span id="srcText">Hazırlanıyor</span></span>
    </div>
    <div class="seg" role="group" aria-label="Girdi türü" id="kinds">
      <button type="button" data-k="karisik" aria-pressed="true">Karışık</button>
      <button type="button" data-k="foto" aria-pressed="false">Fotoğraf</button>
      <button type="button" data-k="doga" aria-pressed="false">Doğa</button>
      <button type="button" data-k="sanat" aria-pressed="false">Sanat</button>
      <button type="button" data-k="kelime" aria-pressed="false">Kelime</button>
    </div>
    <div class="tools">
      <select id="sure" aria-label="Süre">
        <option value="0">Süre: kapalı</option>
        <option value="60">1 dk</option>
        <option value="120">2 dk</option>
        <option value="180" selected>3 dk</option>
        <option value="300">5 dk</option>
        <option value="600">10 dk</option>
      </select>
      <button type="button" class="ghost" id="fs" title="Tam ekran (F)">Tam ekran</button>
    </div>
  </header>

  <div class="focus">
    <label for="odak">Odak</label>
    <input id="odak" type="text" maxlength="120" placeholder="Üzerinde düşündüğünüz problem — örn. “Kampüste bekleme alanları”" autocomplete="off">
  </div>

  <main class="stage" id="stage" aria-live="polite">
    <div class="timebar"><span id="tb"></span></div>
    <p class="word" id="word">Pusula</p>
    <img id="img" alt="" hidden>
    <div class="loading" id="loading" hidden>Girdi çekiliyor…</div>
    <div class="ended" id="ended" hidden>Süre doldu</div>
  </main>

  <div class="credit" id="credit">
    <span class="no" id="no">Nº 4827</span>
    <span class="kind" id="kind">Kelime</span>
    <span class="ttl" id="ttl">Türkçe somut isim</span>
    <span id="meta"></span>
  </div>

  <div class="controls">
    <div class="nav">
      <button type="button" class="ghost" id="prev" aria-label="Önceki girdi" title="Önceki (←)">←</button>
      <button type="button" class="ghost" id="next" aria-label="Sonraki girdi" title="Sonraki (→)">→</button>
    </div>
    <button type="button" class="big" id="yeni">Yeni girdi</button>
    <button type="button" class="clock off" id="clock" title="Sayacı durdur/başlat (T)">süre yok</button>
  </div>

  <footer class="hint">
    <span>Girdiyi değiştirmeyin ve seçmeyin: onunla odak arasında bağlantı kurun. <em>— Edward de Bono, Rastgele Girdi</em></span>
    <span class="keys"><kbd>Boşluk</kbd> yeni girdi · <kbd>←</kbd><kbd>→</kbd> geçmiş · <kbd>T</kbd> sayaç · <kbd>F</kbd> tam ekran</span>
  </footer>
</div>

async function getJSON(url, ms = 7000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
function strip(html) {
  if (!html) return '';
  const d = new DOMParser().parseFromString(html, 'text/html');
  return (d.body.textContent || '').replace(/\s+/g, ' ').trim();
}
function loadImg(src, ms = 15000) {
  return new Promise((res, rej) => {
    const im = new Image(); const t = setTimeout(() => { im.src = ''; rej(new Error('zaman aşımı')); }, ms);
    im.onload = () => { clearTimeout(t); res(src); };
    im.onerror = () => { clearTimeout(t); rej(new Error('görsel yüklenemedi')); };
    im.referrerPolicy = 'no-referrer'; im.src = src;
  });
}

  const start = new Date(EPOCH + Math.random() * (Date.now() - EPOCH - 864e5 * 120)).toISOString().slice(0, 19) + 'Z';
  const j = await getJSON(COMMONS_API + '&list=categorymembers&cmtitle=' + encodeURIComponent(cat)
    + '&cmtype=file&cmsort=timestamp&cmdir=newer&cmstart=' + start + '&cmlimit=50&cmprop=title');
  return karistir(((j.query && j.query.categorymembers) || []).map(x => x.title).filter(t => /\.jpe?g$/i.test(t) && !gorulen.has(t)));
}
async function commons(cat, tur) {
  for (let i = 0; i < 4; i++) {
    let L = commonsListe[cat];
    if (!L || !L.adlar.length || L.kullanilan >= 6) L = commonsListe[cat] = { adlar: await commonsAdlar(cat), kullanilan: 0 };
    const title = L.adlar.pop(); L.kullanilan++;
    if (!title) continue;
    gorulen.add(title);
    const j = await getJSON(COMMONS_API + '&titles=' + encodeURIComponent(title)
      + '&prop=imageinfo&iiprop=url|mime|size|extmetadata&iiurlwidth=1280&iiextmetadatafilter=Artist|LicenseShortName|ObjectName');
    const pages = Object.values((j.query && j.query.pages) || {}).filter(p => {
      const ii = p.imageinfo && p.imageinfo[0];
      if (!ii || ii.mime !== 'image/jpeg' || ii.width < 1200) return false;
      const ar = ii.width / ii.height; return ar > 0.55 && ar < 2.1;
    });
    if (pages.length) {
      const p = pages[0], ii = p.imageinfo[0], m = ii.extmetadata || {};
      return { tur, src: ii.thumburl,
        b: strip(m.ObjectName && m.ObjectName.value) || p.title.replace(/^File:/, '').replace(/\.[a-z]+$/i, '').replace(/_/g, ' '),
        y: strip(m.Artist && m.Artist.value), d: '', l: (m.LicenseShortName && m.LicenseShortName.value) || '',
        k: ii.descriptionurl, s: 'Wikimedia Commons', canli: true };
    }
  }
  throw new Error('Commons boş döndü');
}
async function met() {
  for (let i = 0; i < 5; i++) {
    const s = await getJSON('https://collectionapi.metmuseum.org/public/collection/v1.1/search?q=*&hasImages=true&isHighlight=true&limit=20&offset=' + Math.floor(Math.random() * 2290));
    const ids = (s.objectIDs || []).sort(() => Math.random() - 0.5).slice(0, 4);
    for (const id of ids) {
      if (gorulen.has('met' + id)) continue;
      gorulen.add('met' + id);
      const o = await getJSON('https://collectionapi.metmuseum.org/public/collection/v1/objects/' + id);
      if (o.isPublicDomain && o.primaryImageSmall)
        return { tur: 'sanat', src: o.primaryImageSmall, b: o.title, y: o.artistDisplayName, d: o.objectDate, l: 'CC0 (Public Domain)', k: o.objectURL, s: 'The Metropolitan Museum of Art', canli: true };
    }
  }
  throw new Error('Met uygun eser bulamadı');
}
/* Doğa detayı: bitki ve hayvanların uzuv ve doku yakın çekimleri. Kategoriler küçük olduğu için
   her birinin tüm listesi bir kez alınır ve içinden eşit olasılıkla seçilir. (ağırlık = seçilme payı) */
const DOGA = [
  ['Quality images of extreme macro photography', 3], ['Stamens', 3], ['Leaf textures', 2], ['Bark textures', 2],
  ['Spider silk', 1], ['Insect wings', 1], ['Feathers on black background', 1], ['Close-up photographs of organisms', 1], ['Insect eyes', 1]
];
const dogaListe = {};
async function doga() {
  for (let i = 0; i < 4; i++) {
    let r = Math.random() * DOGA.reduce((s, x) => s + x[1], 0), cat = DOGA[0][0];
    for (const [c, w] of DOGA) { if ((r -= w) < 0) { cat = c; break; } }
    cat = 'Category:' + cat;
    if (!dogaListe[cat]) {
      const j = await getJSON(COMMONS_API + '&list=categorymembers&cmtitle=' + encodeURIComponent(cat) + '&cmtype=file&cmlimit=500&cmprop=title');
      dogaListe[cat] = karistir(((j.query && j.query.categorymembers) || []).map(x => x.title).filter(t => /\.jpe?g$/i.test(t)));
    }
    const L = dogaListe[cat];
    let title; while (L.length && gorulen.has(title = L.pop())) title = null;
    if (!title) continue;
    gorulen.add(title);
    const j = await getJSON(COMMONS_API + '&titles=' + encodeURIComponent(title)
      + '&prop=imageinfo&iiprop=url|mime|size|extmetadata&iiurlwidth=1280&iiextmetadatafilter=Artist|LicenseShortName|ObjectName');
    const p = Object.values((j.query && j.query.pages) || {})[0], ii = p && p.imageinfo && p.imageinfo[0];
    if (!ii || ii.mime !== 'image/jpeg' || ii.width < 1200) continue;
    const ar = ii.width / ii.height; if (ar < 0.55 || ar > 2.1) continue;
    const m = ii.extmetadata || {};
    return { tur: 'doga', src: ii.thumburl,
      b: strip(m.ObjectName && m.ObjectName.value) || p.title.replace(/^File:/, '').replace(/\.[a-z]+$/i, '').replace(/_/g, ' '),
      y: strip(m.Artist && m.Artist.value), d: '', l: (m.LicenseShortName && m.LicenseShortName.value) || '',
      k: ii.descriptionurl, s: 'Wikimedia Commons', canli: true };
  }
  throw new Error('Doğa detayı bulunamadı');
}
async function canli(tur) {
  if (tur === 'foto') return commons('Category:Featured pictures on Wikimedia Commons', 'foto');
  if (tur === 'doga') return doga();
  return met();
}
function havuzdan(tur) {
  const list = HAVUZ.map((x, i) => [x, i]).filter(([x]) => x.t === tur);
  if (!list.length) return null;
  let free = list.filter(([, i]) => !state.usedPool.has(i));
  if (!free.length) { list.forEach(([, i]) => state.usedPool.delete(i)); free = list; }
  const [x, i] = free[Math.floor(Math.random() * free.length)];
  state.usedPool.add(i);
  return { tur, src: 'havuz/' + x.f, b: x.b, y: x.y, d: x.d, l: x.l, k: x.k, s: x.s, canli: false };
}
function kelime() {
  let free = KELIMELER.filter(w => !state.usedWords.has(w));
  if (!free.length) { state.usedWords.clear(); free = KELIMELER; }
  const w = free[Math.floor(Math.random() * free.length)];
  state.usedWords.add(w);
  return { tur: 'kelime', w };
}

/* Bir tür için hazır (görseli önceden yüklenmiş) girdi üret */
async function hazirla(tur) {
  if (tur === 'kelime') return kelime();
  if (!state.live && Date.now() > state.liveRetryAt) state.live = true; // canlı modu yeniden dene
  if (state.live) {
    try {
      const it = await canli(tur); await loadImg(it.src);
      state.liveFails = 0; setSource(true); return it;
    } catch (e) {
      state.liveFails++;
      // Engellendi (güvenlik kuralı, internet yok, istek sınırı): 90 sn arşivle devam et
      if (state.liveFails >= 2 || e instanceof TypeError) { state.live = false; state.liveFails = 0; state.liveRetryAt = Date.now() + 90000; }
    }
  }
  const it = havuzdan(tur);
  if (!it) return kelime();
  try { await loadImg(it.src); setSource(false); return it; } catch { return kelime(); }
}

/* Her görsel tür için bir girdiyi arka planda hazır tut */
const kuyruk = {};
function doldur(tur) { if (tur !== 'kelime' && !kuyruk[tur]) kuyruk[tur] = hazirla(tur).catch(() => kelime()); }
async function al(tur) {
  if (tur === 'kelime') return kelime();
  doldur(tur); const p = kuyruk[tur]; kuyruk[tur] = null;
  const it = await p; doldur(tur); return it;
}
function secTur() {
  if (state.kind !== 'karisik') return state.kind;
  const r = Math.random(); return r < 0.28 ? 'foto' : r < 0.5 ? 'doga' : r < 0.74 ? 'sanat' : 'kelime';
}

/* ---------- Gösterim ---------- */
function setSource(live) {
  const s = $('src'); s.classList.toggle('live', live);
  $('srcText').textContent = live ? 'Canlı · web' : (HAVUZ.length ? 'Arşiv · ' + HAVUZ.length + ' görsel' : 'Çevrimdışı · kelimeler');
}
function goster(it, no) {
  const img = $('img'), word = $('word');
  if (it.tur === 'kelime') {
    img.hidden = true; img.removeAttribute('src'); word.hidden = false; word.textContent = it.w.charAt(0).toLocaleUpperCase('tr') + it.w.slice(1);
    $('ttl').textContent = 'Türkçe somut isim'; $('meta').textContent = '';
  } else {
    word.hidden = true; img.hidden = false; img.src = it.src; img.alt = it.b || KIND_LABEL[it.tur];
    $('ttl').textContent = it.b || 'Adsız';
    const meta = $('meta'); meta.textContent = '';
    const bits = [it.y, it.d, it.l].filter(Boolean).join(' · ');
    if (bits) meta.append(bits + ' · ');
    const a = document.createElement('a'); a.href = it.k; a.target = '_blank'; a.rel = 'noopener'; a.textContent = it.s + ' ↗';
    meta.append(a);
  }
  $('no').textContent = 'Nº ' + no;
  $('kind').textContent = KIND_LABEL[it.tur];
  $('prev').disabled = state.pos <= 0; $('next').disabled = state.pos >= state.history.length - 1;
}
async function yeni() {
  if (state.busy) return;
  state.busy = true; $('stage').classList.add('busy'); $('loading').hidden = false;
  try {
    const it = await al(secTur());
    state.count++; it.no = kartNo();
    state.history.push(it); if (state.history.length > 60) state.history.shift();
    state.pos = state.history.length - 1;
    goster(it, it.no); sayacBaslat();
  } finally {
    state.busy = false; $('stage').classList.remove('busy'); $('loading').hidden = true;
  }
}
/* Her girdiye sıra yerine rastgele bir kart numarası (oturumda tekrar etmez) */
const verilenNo = new Set();
function kartNo() { let n; do { n = 1000 + Math.floor(Math.random() * 9000); } while (verilenNo.has(n)); verilenNo.add(n); return n; }
function gezin(d) {
  const p = state.pos + d; if (p < 0 || p >= state.history.length) return;
  state.pos = p; const it = state.history[p]; goster(it, it.no);
}

/* ---------- Sayaç ---------- */
let audio = null;
function bip() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach(t => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(0.0001, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.25); o.connect(g).connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.3); });
  } catch {}
}
function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function cizSayac() {
  const c = $('clock'), tb = $('tb'), st = $('stage');
  if (!state.sure) { c.textContent = 'süre yok'; c.classList.add('off'); tb.style.width = '0'; st.classList.remove('done'); $('ended').hidden = true; return; }
  c.classList.remove('off');
  c.textContent = (state.paused ? '❚❚ ' : '') + fmt(state.kalan);
  tb.style.width = (100 * (1 - state.kalan / state.sure)) + '%';
  const done = state.timer !== null && state.kalan === 0; st.classList.toggle('done', done); $('ended').hidden = !done;
}
function sayacBaslat() {
  clearInterval(state.timer); state.timer = null; state.paused = false;
  state.kalan = state.sure; cizSayac();
  if (!state.sure) return;
  state.timer = setInterval(() => {
    if (state.paused) return;
    state.kalan = Math.max(0, state.kalan - 1); cizSayac();
    if (state.kalan === 0) { clearInterval(state.timer); bip(); }
  }, 1000);
}
function sayacDegistir() {
  if (!state.sure) return;
  if (state.timer === null || state.kalan === 0) { sayacBaslat(); return; }
  state.paused = !state.paused; cizSayac();
}

/* ---------- Olaylar ---------- */
$('yeni').addEventListener('click', yeni);
$('prev').addEventListener('click', () => gezin(-1));
$('next').addEventListener('click', () => gezin(1));
$('clock').addEventListener('click', sayacDegistir);
$('kinds').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  state.kind = b.dataset.k; store.set('kind', state.kind);
  document.querySelectorAll('#kinds button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  ['foto', 'doga', 'sanat'].forEach(t => { if (state.kind === t || state.kind === 'karisik') doldur(t); });
});
$('sure').addEventListener('change', e => { state.sure = +e.target.value; store.set('sure', state.sure); sayacBaslat(); });
$('odak').addEventListener('input', e => store.set('odak', e.target.value));
$('fs').addEventListener('click', tamEkran);
function tamEkran() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
  } catch {}
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if ((e.key === ' ' || e.key === 'Enter') && e.target.closest('button')) return; // odaktaki düğme kendi işini yapsın
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); yeni(); }
  else if (e.key === 'ArrowLeft') gezin(-1);
  else if (e.key === 'ArrowRight') gezin(1);
  else if (e.key === 't' || e.key === 'T') sayacDegistir();
  else if (e.key === 'f' || e.key === 'F') tamEkran();
});
document.addEventListener('pointerdown', () => { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch {} }, { once: true });

/* ---------- Başlangıç ---------- */
(function baslat() {
  const k = store.get('kind', 'karisik');
  const b = document.querySelector('#kinds button[data-k="' + k + '"]'); if (b) b.click();
  state.sure = +store.get('sure', 180); $('sure').value = String(state.sure);
  $('odak').value = store.get('odak', '');
  setSource(false);
  // İlk girdi anında görünsün: arşivden bir görsel (varsa), yoksa kelime
  const ilk = havuzdan(['foto', 'doga', 'sanat'][Math.floor(Math.random() * 3)]) || havuzdan('foto') || kelime();
  state.count = 1; ilk.no = kartNo(); state.history.push(ilk); state.pos = 0;
  state.kalan = state.sure; goster(ilk, ilk.no); cizSayac();
})();
</script>
